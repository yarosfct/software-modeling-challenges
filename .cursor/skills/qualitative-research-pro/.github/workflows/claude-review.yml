name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          review_comment_prefix: "qualitative-research-pro-review"
          direct_prompt: |
            Review this PR for:
            1. Agent quality — methodology expertise, actionable procedures, correct references
            2. Skill quality — substantive content, primary source citations, worked examples
            3. Methodology accuracy — correct representation of GT and qualitative methods
            4. Consistency — cross-references match, naming conventions followed
            5. No participant data or identifying information committed

            Use qualitative-research-pro's peer-reviewer agent standards.
            Provide VERDICT: PASS | WARN | FAIL
